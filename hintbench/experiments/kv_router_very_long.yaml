name: kv_router_very_long
description: Very long shared-prefix experiment using Dynamo KV routing.
router_mode: kv
model: Qwen/Qwen2.5-0.5B
model_served_name: Qwen/Qwen2.5-0.5B
workload: shared_prefix
hint_policy: static_priority
concurrency: 12
num_conversations: 50
turns_per_conversation: 8
max_tokens: 128
temperature: 0.0
request_timeout_s: 120
results_timezone: America/Chicago
system_prompt: You are a careful assistant. Reuse prior context when possible and answer concisely.
shared_prefix_group: group-a
hint_defaults: {"priority": 5, "reuse_likelihood": 0.9, "agent_phase": "execution", "expected_output_tokens": 128}
notes: Very long KV-router run for the most stable latency and cache-reuse comparisons.
